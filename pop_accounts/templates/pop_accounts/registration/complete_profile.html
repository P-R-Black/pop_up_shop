{% extends "layout.html" %}
{% load static %}


{% block title %}
Complete Profile
{% endblock %}

{% block main %}

<section class="auction_container">
    <div class="complete_social_profile_container">
        <div class="complete_social_profile_title_container">
            <h2>Complete Your Profile</h2>
        </div>
        <form action="" method="POST">
            {% csrf_token %}
            <div>
                {{ form.email.errors }}
                <label for="social_profile_email" class="visually-hidden">First Name</label>
                {{ form.email }}
            </div>
            <div>
                {{ form.first_name.errors }}
                <label for="social_profile_first_name" class="visually-hidden">First Name</label>
                {{ form.first_name }}
            </div>

            <button type="submit" class="button_small_white registrationSubmitButton">Submit</button>
        </form>
    </div>

</section>
{% endblock %}
